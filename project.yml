name: AZip
options:
  bundleIdPrefix: com.dengpeng
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AZipCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/AZipCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dengpeng.AZipCore
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES

  AZip:
    type: application
    platform: macOS
    sources:
      - path: Sources/AZipApp
    dependencies:
      - target: AZipCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: AZip
        CFBundleDisplayName: AZip
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDocumentTypes:
          - CFBundleTypeName: Disk Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.disk-image
              - com.apple.disk-image-udif
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dengpeng.AZip
        GENERATE_INFOPLIST_FILE: NO

  AZipCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AZipCoreTests
        excludes:
          - "Fixtures/**"
      - path: Tests/AZipCoreTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: AZipCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dengpeng.AZipCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AZip:
    build:
      targets:
        AZip: all
        AZipCore: all
        AZipCoreTests: [test]
    test:
      targets:
        - AZipCoreTests
    run:
      config: Debug
