name: AZip
options:
  bundleIdPrefix: com.dengpeng
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  knownRegions:
    - zh-Hans
    - en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "AZip Local Code Signing"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AZipCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/AZipCore
      - path: Resources
        includes:
          - "*.lproj/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dengpeng.AZipCore
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES

  AZip:
    type: application
    platform: macOS
    sources:
      - path: Sources/AZipApp
      - path: Resources
        includes:
          - "*.lproj/**"
      - path: Resources/FileIcons
        buildPhase: resources
      - path: Resources/FileTypePNG
        buildPhase: resources
    dependencies:
      - target: AZipCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: AZip
        CFBundleDisplayName: AZip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - zh-Hans
          - en
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDocumentTypes:
          - CFBundleTypeName: Disk Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            CFBundleTypeIconFile: dmg.icns
            LSItemContentTypes:
              - com.apple.disk-image-udif
          - CFBundleTypeName: ZIP Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeIconFile: zip.icns
            LSItemContentTypes:
              - public.zip-archive
          - CFBundleTypeName: RAR Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeIconFile: rar.icns
            LSItemContentTypes:
              - com.rarlab.rar-archive
          - CFBundleTypeName: 7-Zip Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeIconFile: 7z.icns
            LSItemContentTypes:
              - org.7-zip.7-zip-archive
          - CFBundleTypeName: TAR Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeIconFile: tar.icns
            LSItemContentTypes:
              - public.tar-archive
          - CFBundleTypeName: TGZ Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeIconFile: tar.icns
            LSItemContentTypes:
              - org.gnu.gnu-zip-tar-archive
          - CFBundleTypeName: GZIP Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeIconFile: gz.icns
            LSItemContentTypes:
              - org.gnu.gnu-zip-archive
          - CFBundleTypeName: BZIP2 Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeIconFile: bz2.icns
            LSItemContentTypes:
              - public.bzip2-archive
          - CFBundleTypeName: XZ Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeIconFile: xz.icns
            LSItemContentTypes:
              - org.tukaani.xz-archive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dengpeng.AZip
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AZipCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AZipCoreTests
        excludes:
          - "Fixtures/**"
      - path: Tests/AZipCoreTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: AZipCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dengpeng.AZipCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AZip:
    build:
      targets:
        AZip: all
        AZipCore: all
        AZipCoreTests: [test]
    test:
      targets:
        - AZipCoreTests
    run:
      config: Debug
